name: Publicar

# Cada 30 minutos entre las 8:00 y las 20:30 de Paraguay (UTC-3). Un repo
# privado en el plan gratuito tiene 2.000 minutos de Actions por mes; así se
# usan unos 800. GitHub puede demorar un cron programado varios minutos.
on:
  schedule:
    - cron: '*/30 11-23 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Publicar ya este post (carpeta en posts/), aunque no haya llegado su hora'
        required: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar lo vencido
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python scripts/publish.py --only "$ONLY"; else python scripts/publish.py; fi
      - name: Anotar lo publicado
        if: always()
        run: |
          git add posts/*/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name 'c2tech-social'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'Anota lo publicado'
            git push
          fi
