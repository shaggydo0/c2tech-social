name: Publicar

# A las 12:05 y a las 19:05 de Paraguay (UTC-3): los posts se programan a las
# 12:00 o a las 19:00. Los minutos gratis de Actions (2.000 por mes en repos
# privados) los comparte toda la cuenta y el CI de kudeexpress los agota; así
# esto usa unos 60 por mes. GitHub puede demorar un cron varios minutos.
on:
  schedule:
    - cron: '5 15,22 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Publicar ya este post (carpeta en posts/), aunque no haya llegado su hora'
        required: false
      verify:
        description: 'Sólo probar el token y R2, sin publicar nada'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar lo vencido
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          ONLY: ${{ inputs.only }}
          VERIFY: ${{ inputs.verify }}
        run: |
          if [ "$VERIFY" = "true" ]; then python scripts/publish.py --verify
          elif [ -n "$ONLY" ]; then python scripts/publish.py --only "$ONLY"
          else python scripts/publish.py; fi
      - name: Anotar lo publicado
        if: always()
        run: |
          git add posts/*/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name 'c2tech-social'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'Anota lo publicado'
            git push
          fi
