caption: |
  ¿Qué es el KUDE? Es la versión impresa o en PDF de tu factura electrónica: lo que le entregás a tu cliente. Tiene que mostrar los datos de la venta, el código QR y el CDC, el código de control de 44 dígitos. Con KudeExpress se arma solo, con el logo de tu empresa, y tu cliente recibe el KUDE y el XML por correo cuando la DNIT aprueba la factura. Escribinos al 0987 800 032.

